name: Linter

on: [pull_request]

jobs:
    build:
        name: Linting Code
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Code
              uses: actions/checkout@v2
              with:
                fetch-depth: 0
        
            - name: Performing Linting
              uses: github/super-linter@v3
              env:
                VALIDATE_ALL_CODEBASE: false
                DEFAULT_BRANCH: master
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}